services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:h2:file:/app/data/portfolio
      ADMIN_USERNAME: ${ADMIN_USERNAME:-artist}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-local}
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - portfolio-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  portfolio-data:
